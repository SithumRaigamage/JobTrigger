<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#93C5FD;text-decoration:none}a:hover{color:#BFDBFE}
</style>
</helmet>
<header style="width: 100%; background: #0F172A; border-bottom: 1px solid #1F2A3D; font-family: Inter, system-ui, sans-serif; color: #F1F5F9">
  <div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; min-height: 72px; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #F1F5F9; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </span>
      JobTrigger
    </a>

    <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; font-weight: 500">
        <a href="Features.dc.html" style="{{ nav.features }}">Features</a>
        <a href="Tools.dc.html" style="{{ nav.tools }}">Tools</a>
        <a href="Security.dc.html" style="{{ nav.security }}">Security</a>
        <a href="Changelog.dc.html" style="{{ nav.changelog }}">What's new</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
        <a href="SignIn.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; color: #F1F5F9; font-size: 15px; font-weight: 600; display: flex; align-items: center">Sign in</a>
        <a href="Main.dc.html#download" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #2563EB; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center">Get the app</a>
      </div>
    </sc-if>

    <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
      <nav aria-label="Portal" style="display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; font-weight: 500">
        <a href="Servers.dc.html" style="{{ nav.servers }}">My servers</a>
        <a href="Account.dc.html" style="{{ nav.account }}">Account</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #94A3B8">sam@acme.dev</span>
        <a href="SignIn.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; background: #1E293B; color: #F1F5F9; font-size: 14px; font-weight: 600; display: flex; align-items: center">Sign out</a>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","features","tools","security","changelog","legal","signin","servers","account"],"default":"home"},"signedIn":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'home';
    const signedIn = this.props.signedIn ?? false;
    const base = 'padding: 10px 0; ';
    const style = (key) => key === current
      ? base + 'color: #F1F5F9; box-shadow: inset 0 -2px 0 #2563EB'
      : base + 'color: #CBD5E1';
    return {
      signedIn,
      signedOut: !signedIn,
      nav: {
        features: style('features'), tools: style('tools'), security: style('security'),
        changelog: style('changelog'), servers: style('servers'), account: style('account'),
      },
    };
  }
}
</script>
</body>
</html>
