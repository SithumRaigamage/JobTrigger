<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server saved — JobTrigger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1120}
a{color:#93C5FD;text-decoration:none}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="min-height: 100vh; background: #0B1120; color: #F1F5F9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <dc-import name="Header" current="servers" signed-in="{{ yes }}" hint-size="100%,72px"></dc-import>

  <main style="flex: 1; width: 100%; max-width: 960px; margin: 0 auto; box-sizing: border-box; padding: 72px 20px 96px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
    <div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <span style="width: 64px; height: 64px; border-radius: 20px; background: #0F2E1F; color: #86EFAC; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <div role="status" style="display: flex; flex-direction: column; gap: 12px">
        <h1 style="margin: 0; font-size: 36px; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em">Saved. Now open JobTrigger on your phone.</h1>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #CBD5E1"><strong style="color: #F1F5F9">Acme production</strong> is ready. If the app is already open, just switch back to it — the server appears on its own.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <a href="AddServer.dc.html" style="height: 52px; padding: 0 22px; border-radius: 14px; background: #2563EB; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center">Add another</a>
        <a href="Servers.dc.html" style="height: 52px; padding: 0 20px; border-radius: 14px; background: #1E293B; color: #F1F5F9; font-size: 16px; font-weight: 600; display: flex; align-items: center">Back to my servers</a>
      </div>
    </div>

    <aside style="flex: 1 1 300px; min-width: 0; background: #111A2B; border: 1px solid #1F2A3D; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Don't have the app yet?</h2>
      <div role="img" aria-label="QR code placeholder that opens the store listing" style="width: 140px; height: 140px; box-sizing: border-box; padding: 12px; background: #FFFFFF; border-radius: 14px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{ qr }}" as="cell" hint-placeholder-count="144">
          <span style="{{ cell.style }}"></span>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #CBD5E1">Scan with your phone camera, or</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: 14px; font-weight: 600">
        <a href="https://apps.apple.com/">App Store</a><span style="color: #475569" aria-hidden="true">·</span><a href="https://play.google.com/">Google Play</a>
      </div>
    </aside>
  </main>

  <dc-import name="Footer" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Decorative stand-in for the store QR code; the build renders a real one.
    const cells = [];
    for (let i = 0; i < 144; i++) {
      const r = Math.floor(i / 12), c = i % 12;
      const finder = (r < 3 && c < 3) || (r < 3 && c > 8) || (r > 8 && c < 3);
      const on = finder || ((r * 5 + c * 11 + r * c) % 5 < 2);
      cells.push({ style: 'border-radius: 1px; background: ' + (on ? '#0B1120' : 'transparent') });
    }
    return { yes: true, qr: cells };
  }
}
</script>
</body>
</html>
