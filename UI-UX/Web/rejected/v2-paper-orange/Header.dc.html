<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#B83A0B}
</style>
</helmet>
<header style="width: 100%; background: #F6F5F1; border-bottom: 1px solid #111111; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #111111">
  <div style="max-width: 1240px; margin: 0 auto; box-sizing: border-box; min-height: 72px; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 36px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.03em">
      <span style="width: 14px; height: 14px; background: #FF5A1F; border: 1px solid #111111" aria-hidden="true"></span>
      JobTrigger
    </a>

    <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500">
        <a href="Features.dc.html" style="{{ nav.features }}">Features</a>
        <a href="Tools.dc.html" style="{{ nav.tools }}">Tools</a>
        <a href="Security.dc.html" style="{{ nav.security }}">Security</a>
        <a href="Changelog.dc.html" style="{{ nav.changelog }}">What's new</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
        <a href="SignIn.dc.html" style="height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center">Sign in</a>
        <a href="Main.dc.html#download" style="height: 44px; padding: 0 16px; border-radius: 4px; background: #111111; color: #F6F5F1; font-size: 15px; font-weight: 600; display: flex; align-items: center">Get the app</a>
      </div>
    </sc-if>

    <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
      <span style="padding: 4px 8px; border: 1px solid #111111; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">SETUP</span>
      <nav aria-label="Portal" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500">
        <a href="Servers.dc.html" style="{{ nav.servers }}">My servers</a>
        <a href="Account.dc.html" style="{{ nav.account }}">Account</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 14px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5F5E5A">sam@acme.dev</span>
        <a href="SignIn.dc.html" style="height: 44px; padding: 0 14px; border: 1px solid #111111; border-radius: 4px; font-size: 14px; font-weight: 600; display: flex; align-items: center">Sign out</a>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","features","tools","security","changelog","legal","signin","servers","account"],"default":"home"},"signedIn":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'home';
    const signedIn = this.props.signedIn ?? false;
    const style = (key) => key === current
      ? 'padding: 10px 0; color: #111111; box-shadow: inset 0 -3px 0 #FF5A1F'
      : 'padding: 10px 0; color: #3D3D3A';
    return {
      signedIn,
      signedOut: !signedIn,
      nav: {
        features: style('features'), tools: style('tools'), security: style('security'),
        changelog: style('changelog'), servers: style('servers'), account: style('account'),
      },
    };
  }
}
</script>
</body>
</html>
