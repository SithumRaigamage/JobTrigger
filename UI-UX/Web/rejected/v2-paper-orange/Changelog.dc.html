<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobTrigger — what's new</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#111111;text-decoration:underline;text-decoration-color:#FF5A1F;text-underline-offset:3px}a:hover{color:#B83A0B}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F5F1; color: #111111; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <dc-import name="Header" current="changelog" hint-size="100%,72px"></dc-import>

  <main style="width: 100%; max-width: 1000px; margin: 0 auto; box-sizing: border-box; padding: 72px 20px 96px; display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B83A0B">CHANGELOG</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">What's new</h1>
    </div>

    <ol style="margin: 0; padding: 0; list-style: none; border-left: 2px solid #111111">
      <sc-for list="{{ releases }}" as="r" hint-placeholder-count="3">
        <li style="position: relative; padding: 0 0 48px 36px; display: flex; flex-wrap: wrap; gap: 12px 40px">
          <span aria-hidden="true" style="{{ r.dot }}"></span>
          <div style="flex: 0 0 160px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500">{{ r.version }}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5E5A">{{ r.date }}</span>
            <sc-if value="{{ r.latest }}" hint-placeholder-val="{{ false }}">
              <span style="align-self: flex-start; padding: 3px 8px; border-radius: 4px; background: #FF5A1F; border: 1px solid #111111; font-family: 'IBM Plex Mono', monospace; font-size: 11px">LATEST</span>
            </sc-if>
          </div>
          <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">{{ r.title }}</h2>
            <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; line-height: 1.6; color: #3D3D3A">
              <sc-for list="{{ r.items }}" as="it" hint-placeholder-count="3">
                <li>{{ it.text }}</li>
              </sc-for>
            </ul>
          </div>
        </li>
      </sc-for>
    </ol>
  </main>

  <dc-import name="Footer" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    const rel = [
      { title: 'A fresh new look', items: ['Every screen redesigned, clearer in light and dark', 'Build status always has a text label, not only a colour', 'Only working tools are shown, with a "request a tool" link'] },
      { title: 'Much more Jenkins', items: ['Notifications when a watched build finishes', 'Pinned jobs and a home-screen widget', 'Nodes, the queue, views and multibranch', 'Face ID / fingerprint app lock'] },
      { title: 'GitHub Actions and SonarQube', items: ['GitHub accounts, repositories and workflows', 'SonarQube projects and quality gates'] },
    ];
    return {
      releases: rel.map((r, i) => ({
        ...r,
        version: '[VERSION]',
        date: '[DATE]',
        latest: i === 0,
        items: r.items.map((text) => ({ text })),
        dot: 'position: absolute; left: -9px; top: 4px; width: 14px; height: 14px; border: 1px solid #111111; background: ' + (i === 0 ? '#FF5A1F' : '#F6F5F1'),
      })),
    };
  }
}
</script>
</body>
</html>
