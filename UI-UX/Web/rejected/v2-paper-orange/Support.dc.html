<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobTrigger — support</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#111111;text-decoration:underline;text-decoration-color:#FF5A1F;text-underline-offset:3px}a:hover{color:#B83A0B}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F5F1; color: #111111; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <dc-import name="Header" current="legal" hint-size="100%,72px"></dc-import>

  <main style="width: 100%; max-width: 900px; margin: 0 auto; box-sizing: border-box; padding: 72px 20px 96px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B83A0B">SUPPORT</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">How can we help?</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3D3D3A">Most setup problems are one of these four.</p>
    </div>

    <div style="border: 1px solid #111111; border-radius: 4px; background: #FFFFFF">
      <sc-for list="{{ faqs }}" as="faq" hint-placeholder-count="4">
        <div style="{{ faq.rowStyle }}">
          <button type="button" onClick="{{ faq.toggle }}" aria-expanded="{{ faq.expanded }}" style="width: 100%; min-height: 64px; padding: 20px 24px; background: transparent; border: 0; color: #111111; font: 600 17px 'IBM Plex Sans', sans-serif; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer">
            {{ faq.q }}
            <span aria-hidden="true" style="{{ faq.signStyle }}">{{ faq.sign }}</span>
          </button>
          <sc-if value="{{ faq.open }}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 0 24px 22px; font-size: 16px; line-height: 1.65; color: #3D3D3A">{{ faq.a }}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <section style="background: #111111; color: #F6F5F1; border-radius: 4px; padding: 36px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Still stuck?</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #D9D7D0">Tell us your app version and what you tried. Never send us a token — we will never ask for one.</p>
      </div>
      <a href="mailto:support@example.com" style="height: 52px; padding: 0 22px; border-radius: 4px; background: #FF5A1F; color: #111111; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center">Email support</a>
    </section>
  </main>

  <dc-import name="Footer" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 0 }; }
  renderVals() {
    const items = [
      { q: 'I added a server on the website but the app doesn’t show it', a: 'Check the app is signed in to the same JobTrigger account. Switch away from the app and back, or pull to refresh on the home screen.' },
      { q: 'Jenkins says my credentials are wrong', a: 'JobTrigger needs a Jenkins API token, not your password if your server uses single sign-on. Create one under your name → Security → API Token.' },
      { q: 'The app can’t reach my Jenkins server', a: 'If Jenkins is only on your office network or VPN, connect your phone to it first. The website can save the server either way.' },
      { q: 'I forgot my JobTrigger password', a: 'Password reset isn’t available yet. Email support from your account’s address and we will help.' },
    ];
    const open = this.state.open;
    return {
      faqs: items.map((f, i) => ({
        ...f,
        open: open === i,
        expanded: open === i ? 'true' : 'false',
        sign: open === i ? '−' : '+',
        signStyle: 'width: 32px; height: 32px; flex: none; border: 1px solid #111111; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: ' + (open === i ? '#FF5A1F' : 'transparent'),
        rowStyle: i < items.length - 1 ? 'border-bottom: 1px solid #D9D7D0' : '',
        toggle: () => this.setState({ open: open === i ? -1 : i }),
      })),
    };
  }
}
</script>
</body>
</html>
