<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add server — JobTrigger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#111111;text-decoration:underline;text-decoration-color:#FF5A1F;text-underline-offset:3px}a:hover{color:#B83A0B}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F5F1; color: #111111; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <dc-import name="Header" current="servers" signed-in="{{ yes }}" hint-size="100%,72px"></dc-import>

  <main style="flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: 48px 20px 96px; display: flex; flex-direction: column; gap: 28px">
    <a href="Servers.dc.html" style="align-self: flex-start; font-size: 14px; font-weight: 600">← My servers</a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Add a server</h1>

    <div role="tablist" aria-label="Tool" style="display: flex; flex-wrap: wrap; border: 1px solid #111111; border-radius: 4px; align-self: flex-start; overflow: hidden">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 0; border: 1px solid #111111; border-radius: 4px; background: #FFFFFF">
      <form style="flex: 999 1 520px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="name" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3D3D3A">NAME</label>
          <input id="name" type="text" value="{{ nameValue }}" style="height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #111111; border-radius: 4px; color: #111111; font: 400 16px 'IBM Plex Sans', sans-serif; outline: none">
        </div>
        <sc-if value="{{ needsUrl }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="url" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3D3D3A">SERVER URL</label>
            <input id="url" type="url" inputmode="url" spellcheck="false" value="{{ urlValue }}" style="height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #111111; border-radius: 4px; color: #111111; font: 400 15px 'IBM Plex Mono', monospace; outline: none">
          </div>
        </sc-if>
        <sc-if value="{{ isJenkins }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="user" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3D3D3A">USERNAME</label>
            <input id="user" type="text" autocomplete="off" spellcheck="false" value="sam" style="height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #111111; border-radius: 4px; color: #111111; font: 400 15px 'IBM Plex Mono', monospace; outline: none">
          </div>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="token" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3D3D3A">{{ tokenLabel }}</label>
          <div style="display: flex; align-items: center; height: 50px; padding: 0 4px 0 14px; background: #FFFFFF; border: 1px solid #111111; border-radius: 4px">
            <input id="token" type="password" autocomplete="off" spellcheck="false" value="11a2b3c4d5e6f7a8b9c0" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #111111; font: 400 15px 'IBM Plex Mono', monospace; outline: none">
            <button type="button" aria-label="Show token" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3D3D3A; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span style="font-size: 13px; color: #3D3D3A">Sent once, encrypted, never shown again in full.</span>
        </div>
        <sc-if value="{{ tested }}" hint-placeholder-val="{{ false }}">
          <div role="status" style="padding: 12px 14px; border: 1px solid #0A6B34; border-radius: 4px; background: #E3F1E7; color: #0A6B34; font-size: 14px; font-weight: 600">✓ Connected as <span style="font-family: 'IBM Plex Mono', monospace">sam</span></div>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px">
          <a href="Saved.dc.html" style="height: 52px; padding: 0 28px; border-radius: 4px; background: #FF5A1F; border: 1px solid #111111; box-shadow: 4px 4px 0 #111111; color: #111111; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center">Save server</a>
          <button type="button" onClick="{{ test }}" style="height: 52px; padding: 0 20px; border-radius: 4px; border: 1px solid #111111; background: transparent; color: #111111; font: 600 15px 'IBM Plex Sans', sans-serif; cursor: pointer">Test connection</button>
          <a href="Servers.dc.html" style="height: 52px; padding: 0 12px; color: #3D3D3A; font-size: 15px; font-weight: 600; display: flex; align-items: center">Cancel</a>
        </div>
      </form>

      <aside id="help" aria-label="How to get a token" style="flex: 1 1 340px; min-width: 0; padding: 32px; background: #111111; color: #F6F5F1; display: flex; flex-direction: column; gap: 18px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #FF5A1F">HOW DO I GET THIS?</span>
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">{{ helpTitle }}</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{ steps }}" as="step" hint-placeholder-count="4">
            <li style="display: flex; gap: 14px; font-size: 15px; line-height: 1.55; color: #D9D7D0">
              <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #FF5A1F">{{ step.n }}</span>
              <span>{{ step.text }}</span>
            </li>
          </sc-for>
        </ol>
        <p style="margin: 0; padding-top: 16px; border-top: 1px solid #3D3D3A; font-size: 14px; line-height: 1.55; color: #F6F5F1">{{ helpTip }}</p>
      </aside>
    </div>
  </main>

  <dc-import name="Footer" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tool: 'jenkins', tested: false }; }
  renderVals() {
    const tool = this.state.tool;
    const tools = [
      { id: 'jenkins', label: 'Jenkins' },
      { id: 'github', label: 'GitHub' },
      { id: 'sonar', label: 'SonarQube' },
    ];
    const help = {
      jenkins: {
        title: 'Getting a Jenkins API token',
        steps: ['Open Jenkins and sign in.', 'Click your name (top right), then Security.', 'Under API Token, click Add new token and name it "JobTrigger".', 'Click Generate and copy it. Jenkins shows it only once.'],
        tip: 'Use an API token, not your password — it works with single sign-on and you can revoke it on its own.',
      },
      github: {
        title: 'Getting a GitHub token',
        steps: ['Settings → Developer settings → Personal access tokens → Fine-grained tokens.', 'Generate new token; pick only the repositories you need.', 'Repository permissions: Actions "Read and write", Metadata "Read-only".', 'Set an expiry date, generate, and copy it.'],
        tip: 'A fine-grained token limited to a few repositories is safer than a classic one.',
      },
      sonar: {
        title: 'Getting a SonarQube token',
        steps: ['Sign in to SonarQube.', 'Open My Account → Security.', 'Name it "JobTrigger" and choose User token.', 'Click Generate and copy it.'],
        tip: 'Set an expiry date so an old token stops working on its own.',
      },
    }[tool];
    const tabBase = 'height: 46px; padding: 0 22px; border: 0; font: 600 15px \'IBM Plex Sans\', sans-serif; cursor: pointer; ';
    return {
      yes: true,
      tabs: tools.map((t, i) => ({
        ...t,
        selected: t.id === tool ? 'true' : 'false',
        style: tabBase + (i > 0 ? 'border-left: 1px solid #111111; ' : '') + (t.id === tool ? 'background: #111111; color: #F6F5F1' : 'background: #F6F5F1; color: #111111'),
        pick: () => this.setState({ tool: t.id, tested: false }),
      })),
      isJenkins: tool === 'jenkins',
      needsUrl: tool !== 'github',
      nameValue: { jenkins: 'Acme production', github: 'Acme org', sonar: 'Acme quality' }[tool],
      urlValue: tool === 'sonar' ? 'https://sonar.acme.dev' : 'https://ci.acme.dev',
      tokenLabel: { jenkins: 'API TOKEN', github: 'PERSONAL ACCESS TOKEN', sonar: 'USER TOKEN' }[tool],
      helpTitle: help.title,
      helpTip: help.tip,
      steps: help.steps.map((text, i) => ({ n: '0' + (i + 1), text })),
      tested: this.state.tested,
      test: () => this.setState({ tested: true }),
    };
  }
}
</script>
</body>
</html>
