<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobTrigger — support</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#1D4ED8;text-decoration:none}a:hover{color:#1E40AF}
</style>
</helmet>
<div style="min-height: 100vh; background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <dc-import name="Header" current="support" hint-size="100%,72px"></dc-import>

  <main style="display: flex; flex-direction: column">
    <section style="background-color: #0B1120; background-image: radial-gradient(#1F2A3D 1px, transparent 1px); background-size: 28px 28px; color: #F1F5F9">
      <div style="max-width: 960px; margin: 0 auto; box-sizing: border-box; padding: 88px 20px 120px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #93C5FD">Support</span>
        <h1 style="margin: 0; font-size: 60px; line-height: 1.02; font-weight: 800; letter-spacing: -0.045em">How can we help?</h1>
        <p style="margin: 0; font-size: 18px; color: #CBD5E1">Most setup problems are one of the four below.</p>
      </div>
    </section>

    <div style="width: 100%; max-width: 960px; margin: -72px auto 0; box-sizing: border-box; padding: 0 20px 104px; display: flex; flex-direction: column; gap: 32px">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
        <sc-for list="{{ topics }}" as="t" hint-placeholder-count="4">
          <a href="#faq" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1); padding: 22px; color: #0F172A; display: flex; flex-direction: column; gap: 10px">
            <span style="{{ t.iconStyle }}">{{ t.glyph }}</span>
            <span style="font-size: 16px; font-weight: 700">{{ t.t }}</span>
            <span style="font-size: 13px; color: #475569">{{ t.d }}</span>
          </a>
        </sc-for>
      </div>

      <div id="faq" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06); overflow: hidden">
        <sc-for list="{{ faqs }}" as="faq" hint-placeholder-count="4">
          <div style="{{ faq.rowStyle }}">
            <button type="button" onClick="{{ faq.toggle }}" aria-expanded="{{ faq.expanded }}" style="width: 100%; min-height: 64px; padding: 20px 24px; background: transparent; border: 0; color: #0F172A; font: 600 16px Inter, sans-serif; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer">
              {{ faq.q }}
              <span aria-hidden="true" style="{{ faq.signStyle }}">{{ faq.sign }}</span>
            </button>
            <sc-if value="{{ faq.open }}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0; padding: 0 24px 22px; font-size: 15px; line-height: 1.65; color: #475569">{{ faq.a }}</p>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <section style="position: relative; overflow: hidden; background: #2563EB; color: #FFFFFF; border-radius: 24px">
        <div aria-hidden="true" style="position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px; border-radius: 999px; border: 36px solid rgba(255, 255, 255, 0.12)"></div>
        <div style="position: relative; padding: 36px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
          <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <h2 style="margin: 0; font-size: 26px; font-weight: 800">Still stuck?</h2>
            <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #FFFFFF">Tell us your app version and what you tried. Never send us a token — we will never ask for one.</p>
          </div>
          <a href="mailto:support@example.com" style="height: 52px; padding: 0 24px; border-radius: 999px; background: #FFFFFF; color: #1D4ED8; font-size: 16px; font-weight: 700; display: flex; align-items: center">Email support</a>
        </div>
      </section>
    </div>
  </main>

  <dc-import name="Footer" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 0 }; }
  renderVals() {
    const icon = (bg, fg) => 'width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; background: ' + bg + '; color: ' + fg;
    const topics = [
      { glyph: '⇄', t: 'Web setup', d: 'Servers not showing up', iconStyle: icon('#DBEAFE', '#1D4ED8') },
      { glyph: 'J', t: 'Jenkins tokens', d: 'Credentials rejected', iconStyle: icon('#FEE2E2', '#B91C1C') },
      { glyph: '◎', t: 'Connections', d: 'VPN and private servers', iconStyle: icon('#FFEDD5', '#C2410C') },
      { glyph: '◉', t: 'Your account', d: 'Passwords and sign-in', iconStyle: icon('#DCFCE7', '#15803D') },
    ];
    const items = [
      { q: 'I added a server on the website but the app doesn’t show it', a: 'Make sure the app is signed in to the same JobTrigger account. Switch away from the app and back, or pull to refresh on the home screen.' },
      { q: 'Jenkins says my credentials are wrong', a: 'JobTrigger needs a Jenkins API token, not your Jenkins password if your server uses single sign-on. Create one under your name → Security → API Token.' },
      { q: 'The app can’t reach my Jenkins server', a: 'If Jenkins is only on your office network or VPN, connect your phone to that network first. The website can save it either way.' },
      { q: 'I forgot my JobTrigger password', a: 'Password reset isn’t available yet. Email support from the address on your account and we will help you.' },
    ];
    const open = this.state.open;
    return {
      topics,
      faqs: items.map((f, i) => ({
        ...f,
        open: open === i,
        expanded: open === i ? 'true' : 'false',
        sign: open === i ? '−' : '+',
        signStyle: 'width: 32px; height: 32px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 18px; ' + (open === i ? 'background: #2563EB; color: #FFFFFF' : 'background: #F1F5F9; color: #334155'),
        rowStyle: i < items.length - 1 ? 'border-bottom: 1px solid #E2E8F0' : '',
        toggle: () => this.setState({ open: open === i ? -1 : i }),
      })),
    };
  }
}
</script>
</body>
</html>
