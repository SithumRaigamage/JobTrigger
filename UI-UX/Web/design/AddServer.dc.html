<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add server — JobTrigger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#1D4ED8;text-decoration:none}a:hover{color:#1E40AF}
</style>
</helmet>
<div style="min-height: 100vh; background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <aside style="flex: 1 1 240px; max-width: 280px; background: #0B1120">
    <dc-import name="Sidebar" current="add" hint-size="100%,600px"></dc-import>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px clamp(20px, 4vw, 56px) 80px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Add a server</h1>
      <ol aria-label="Steps" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; font-weight: 600">
        <li style="display: flex; align-items: center; gap: 8px; color: #15803D"><span style="width: 24px; height: 24px; border-radius: 999px; background: #DCFCE7; display: flex; align-items: center; justify-content: center">✓</span>Choose a tool</li>
        <li aria-hidden="true" style="width: 32px; height: 2px; background: #2563EB"></li>
        <li aria-current="step" style="display: flex; align-items: center; gap: 8px; color: #1D4ED8"><span style="width: 24px; height: 24px; border-radius: 999px; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center">2</span>Paste details</li>
        <li aria-hidden="true" style="width: 32px; height: 2px; background: #CBD5E1"></li>
        <li style="display: flex; align-items: center; gap: 8px; color: #475569"><span style="width: 24px; height: 24px; border-radius: 999px; background: #E2E8F0; display: flex; align-items: center; justify-content: center">3</span>Open the app</li>
      </ol>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tool</legend>
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" style="{{ t.style }}">
          <span style="{{ t.logoStyle }}">{{ t.mark }}</span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{ t.label }}</span><span style="font-size: 12px; font-weight: 500; color: #475569">{{ t.sub }}</span></span>
        </button>
      </sc-for>
    </fieldset>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
      <form style="flex: 999 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06); padding: 30px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="name" style="font-size: 13px; font-weight: 600; color: #334155">Name</label>
          <input id="name" type="text" value="{{ nameValue }}" style="height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 12px; color: #0F172A; font: 400 16px Inter, sans-serif; outline: none">
        </div>
        <sc-if value="{{ needsUrl }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="url" style="font-size: 13px; font-weight: 600; color: #334155">Server URL</label>
            <input id="url" type="url" inputmode="url" spellcheck="false" value="{{ urlValue }}" style="height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 12px; color: #0F172A; font: 400 15px 'JetBrains Mono', monospace; outline: none">
          </div>
        </sc-if>
        <sc-if value="{{ isJenkins }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="user" style="font-size: 13px; font-weight: 600; color: #334155">Username</label>
            <input id="user" type="text" autocomplete="off" spellcheck="false" value="sam" style="height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 12px; color: #0F172A; font: 400 15px 'JetBrains Mono', monospace; outline: none">
          </div>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="token" style="font-size: 13px; font-weight: 600; color: #334155">{{ tokenLabel }}</label>
          <div style="display: flex; align-items: center; height: 50px; padding: 0 4px 0 14px; background: #FFFFFF; border: 2px solid #2563EB; border-radius: 12px; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15)">
            <input id="token" type="password" autocomplete="off" spellcheck="false" value="11a2b3c4d5e6f7a8b9c0" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #0F172A; font: 400 15px 'JetBrains Mono', monospace; outline: none">
            <button type="button" aria-label="Show token" style="width: 44px; height: 44px; border: 0; background: transparent; color: #475569; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #475569">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            Sent once, encrypted, never shown again in full.
          </span>
        </div>
        <sc-if value="{{ tested }}" hint-placeholder-val="{{ false }}">
          <div role="status" style="padding: 12px 14px; border-radius: 12px; background: #DCFCE7; color: #15803D; font-size: 14px; font-weight: 600">✓ Connected as <span style="font-family: 'JetBrains Mono', monospace">sam</span></div>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px">
          <a href="Saved.dc.html" style="height: 52px; padding: 0 28px; border-radius: 14px; background: #2563EB; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3)">Save server</a>
          <button type="button" onClick="{{ test }}" style="height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid #94A3B8; background: #FFFFFF; color: #0F172A; font: 600 15px Inter, sans-serif; cursor: pointer">Test connection</button>
        </div>
      </form>

      <aside id="help" aria-label="How to get a token" style="flex: 1 1 300px; min-width: 0; background: #0B1120; color: #F1F5F9; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #93C5FD">How do I get this?</span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 800">{{ helpTitle }}</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
          <sc-for list="{{ steps }}" as="step" hint-placeholder-count="4">
            <li style="display: flex; gap: 14px">
              <span style="display: flex; flex-direction: column; align-items: center">
                <span style="width: 26px; height: 26px; flex: none; border-radius: 999px; background: #10284A; color: #93C5FD; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ step.n }}</span>
                <span style="{{ step.lineStyle }}"></span>
              </span>
              <span style="padding: 2px 0 16px; font-size: 14px; line-height: 1.55; color: #CBD5E1">{{ step.text }}</span>
            </li>
          </sc-for>
        </ol>
        <p style="margin: 0; margin-top: auto; padding: 12px 14px; border-radius: 12px; background: #3A2210; color: #FDBA74; font-size: 13px; line-height: 1.5">{{ helpTip }}</p>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tool: 'jenkins', tested: false }; }
  renderVals() {
    const tool = this.state.tool;
    const logo = (bg, fg) => 'width: 40px; height: 40px; flex: none; border-radius: 11px; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; background: ' + bg + '; color: ' + fg;
    const defs = [
      { id: 'jenkins', label: 'Jenkins', sub: 'URL · user · API token', mark: 'J', logoStyle: logo('#D33833', '#FFFFFF') },
      { id: 'github', label: 'GitHub', sub: 'Personal access token', mark: 'GH', logoStyle: logo('#0F172A', '#FFFFFF') },
      { id: 'sonar', label: 'SonarQube', sub: 'URL · user token', mark: 'SQ', logoStyle: logo('#126ED3', '#FFFFFF') },
    ];
    const help = {
      jenkins: {
        title: 'Getting a Jenkins API token',
        steps: ['Open Jenkins and sign in.', 'Click your name (top right), then Security.', 'Under API Token, click Add new token and name it "JobTrigger".', 'Click Generate and copy it. Jenkins shows it only once.'],
        tip: 'Use an API token, not your password — it works with single sign-on and you can revoke it on its own.',
      },
      github: {
        title: 'Getting a GitHub token',
        steps: ['Settings → Developer settings → Personal access tokens → Fine-grained tokens.', 'Generate new token; pick only the repositories you need.', 'Repository permissions: Actions "Read and write", Metadata "Read-only".', 'Set an expiry date, generate, and copy it.'],
        tip: 'A fine-grained token limited to a few repositories is safer than a classic one.',
      },
      sonar: {
        title: 'Getting a SonarQube token',
        steps: ['Sign in to SonarQube.', 'Open My Account → Security.', 'Name it "JobTrigger" and choose User token.', 'Click Generate and copy it.'],
        tip: 'Set an expiry date so an old token stops working on its own.',
      },
    }[tool];
    return {
      tiles: defs.map((d) => {
        const on = d.id === tool;
        return {
          ...d,
          pressed: on ? 'true' : 'false',
          style: 'min-height: 72px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; color: #0F172A; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; font: inherit; ' + (on ? 'border: 2px solid #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15)' : 'border: 1px solid #E2E8F0'),
          pick: () => this.setState({ tool: d.id, tested: false }),
        };
      }),
      isJenkins: tool === 'jenkins',
      needsUrl: tool !== 'github',
      nameValue: { jenkins: 'Acme production', github: 'Acme org', sonar: 'Acme quality' }[tool],
      urlValue: tool === 'sonar' ? 'https://sonar.acme.dev' : 'https://ci.acme.dev',
      tokenLabel: { jenkins: 'API token', github: 'Personal access token', sonar: 'User token' }[tool],
      helpTitle: help.title,
      helpTip: help.tip,
      steps: help.steps.map((text, i) => ({ n: i + 1, text, lineStyle: 'flex: 1; width: 2px; margin: 4px 0; background: ' + (i === help.steps.length - 1 ? 'transparent' : '#1F2A3D') })),
      tested: this.state.tested,
      test: () => this.setState({ tested: true }),
    };
  }
}
</script>
</body>
</html>
