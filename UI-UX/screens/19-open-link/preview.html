<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open link on another server</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1120; color: #F1F5F9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 96px 24px 40px; gap: 28px">

  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #111A2B; border: 1px solid #1F2A3D; display: flex; align-items: center; justify-content: center; color: #93C5FD">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2">This build is on a different server</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #94A3B8">Opening it switches your active server. You can switch back from Settings.</p>
  </div>

  <div style="padding: 16px; background: #111A2B; border: 1px solid #1F2A3D; border-radius: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; color: #94A3B8">Opens</span>
      <span style="font: 500 15px 'JetBrains Mono', monospace">nightly-backup #212</span>
    </div>
    <div style="height: 1px; background: #1F2A3D"></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); align-items: center; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: #94A3B8">From</span>
        <span style="font-size: 14px; font-weight: 500">Acme production</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: #94A3B8">To</span>
        <span style="font-size: 14px; font-weight: 500">Home lab</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #3A2210; font-size: 13px; line-height: 1.4; color: #FED7AA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3 2 21h20zM12 10v5M12 18h.01"/></svg>
      Home lab uses http://, so its traffic isn’t encrypted.
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: #2563EB; color: #FFFFFF; font: 600 16px Inter, sans-serif">Switch and open</button>
    <button type="button" style="height: 52px; border: 1px solid #1F2A3D; border-radius: 14px; background: transparent; color: #F1F5F9; font: 600 16px Inter, sans-serif">Stay on Acme production</button>
  </div>
</div>
</body>
</html>
