<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#93C5FD;text-decoration:none}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1120; color: #F1F5F9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 96px 24px 40px; gap: 32px">

  <div style="display: flex; flex-direction: column; gap: 18px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: {{accent}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Welcome back</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #94A3B8">Log in to trigger and watch your builds.</p>
    </div>
  </div>

  <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #3A1418; color: #FECACA; font-size: 14px; line-height: 1.4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3 2 21h20zM12 10v5M12 18h.01"/></svg>
      Invalid email or password.
    </div>
  </sc-if>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="email" style="font-size: 13px; font-weight: 600; color: #CBD5E1">Email</label>
      <input id="email" type="email" autocomplete="email" value="sam@acme.dev" style="height: 50px; padding: 0 14px; background: #111A2B; border: 1px solid #1F2A3D; border-radius: 12px; color: #F1F5F9; font: 400 16px Inter, sans-serif; outline: none">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="password" style="font-size: 13px; font-weight: 600; color: #CBD5E1">Password</label>
      <div style="display: flex; align-items: center; height: 50px; padding: 0 4px 0 14px; background: #111A2B; border: 1px solid {{passwordBorder}}; border-radius: 12px">
        <input id="password" type="password" autocomplete="current-password" value="hunter22" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F1F5F9; font: 400 16px Inter, sans-serif; outline: none">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; color: #94A3B8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
  </form>

  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: auto">
    <a href="ToolSelection.dc.html" style="height: 52px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Log in</a>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #94A3B8">New to JobTrigger? <a href="Signup.dc.html" style="font-weight: 600">Create an account</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#7C3AED","#0F766E","#C2410C"]},"showError":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const showError = this.props.showError ?? false;
    return {
      accent: this.props.accent ?? '#2563EB',
      showError,
      passwordBorder: showError ? '#F87171' : '#1F2A3D'
    };
  }
}
</script>
</body>
</html>
