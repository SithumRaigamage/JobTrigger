<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your CI tool</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1120; color: #F1F5F9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 72px 20px 40px; gap: 24px">

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; color: #94A3B8">Step 1 of 2</span>
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">What do you build with?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #94A3B8">You can switch any time from Settings.</p>
  </div>

  <div role="radiogroup" aria-label="CI tool" style="display: flex; flex-direction: column; gap: 10px">
    <a href="Main.dc.html" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: #111A2B; border: 2px solid #2563EB">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #D12E2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">J</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">Jenkins</span><span style="font-size: 13px; color: #94A3B8">Automate builds &amp; pipelines</span></span>
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
      </span>
    </a>
    <a href="GitHubRepos.dc.html" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: #111A2B; border: 2px solid #1F2A3D">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #F1F5F9; color: #0B1120; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">G</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">GitHub Actions</span><span style="font-size: 13px; color: #94A3B8">CI/CD built into GitHub</span></span>
      <span style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #334155; box-sizing: border-box"></span>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #94A3B8">Coming later</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 14px; background: #0F172A; border: 1px dashed #263248">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #1E293B; color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-weight: 700">GL</span>
        <span style="font-size: 13px; color: #CBD5E1">GitLab CI</span>
      </div>
      <div aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 14px; background: #0F172A; border: 1px dashed #263248">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #1E293B; color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-weight: 700">SQ</span>
        <span style="font-size: 13px; color: #CBD5E1">SonarQube</span>
      </div>
      <div aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 14px; background: #0F172A; border: 1px dashed #263248">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #1E293B; color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-weight: 700">CC</span>
        <span style="font-size: 13px; color: #CBD5E1">CircleCI</span>
      </div>
    </div>
  </div>

  <a href="Main.dc.html" style="margin-top: auto; height: 52px; border-radius: 14px; background: #2563EB; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continue with Jenkins</a>
</div>

</html>
