        <span style="flex: 1; font: 600 15px 'JetBrains Mono', monospace">linux-agent-01</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #86EFAC"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4ADE80"></span>Online</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #94A3B8"><span>Executors</span><span style="font-family: 'JetBrains Mono', monospace; color: #CBD5E1">3 / 4 busy</span></div>

    <article style="padding: 14px; background: #111A2B; border: 1px solid #1F2A3D; border-radius: 16px; display: flex; flex-direction: column; gap: 12px">

        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #86EFAC"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4ADE80"></span>Online</span>

    </article>

    <article style="padding: 14px; background: #111A2B; border: 1px solid #1F2A3D; border-radius: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="flex: 1; font: 600 15px 'JetBrains Mono', monospace; color: #CBD5E1">windows-agent</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #CBD5E1"><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #94A3B8; box-sizing: border-box"></span>Offline</span>
