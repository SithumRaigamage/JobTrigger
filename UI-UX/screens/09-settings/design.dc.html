<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1120; color: #F1F5F9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 56px 20px 8px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Settings</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #94A3B8">Jenkins servers</h2>
      <a href="ServerSheet.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; color: #93C5FD">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add
      </a>
    </div>
    <div style="background: #111A2B; border: 1px solid #1F2A3D; border-radius: 16px; display: flex; flex-direction: column">
      <a href="ServerSheet.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px; border-bottom: 1px solid #1F2A3D">
        <span style="width: 22px; height: 22px; flex: none; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Acme production</span><span style="font: 400 12px 'JetBrains Mono', monospace; color: #94A3B8">https://jenkins.acme.dev</span></span>
        <span style="font-size: 12px; font-weight: 600; color: #CBD5E1">Active</span>
      </a>
      <a href="ServerSheet.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px">
        <span style="width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid #334155; box-sizing: border-box"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Home lab</span><span style="display: flex; align-items: center; gap: 6px; font: 400 12px 'JetBrains Mono', monospace; color: #FDBA74"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 21h20zM12 10v5M12 18h.01"/></svg>http:// — not encrypted</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </div>

    <h2 style="margin: 10px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #94A3B8">Connections</h2>
    <div style="background: #111A2B; border: 1px solid #1F2A3D; border-radius: 16px; display: flex; flex-direction: column">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid #1F2A3D">
        <span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #F1F5F9; color: #0B1120; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">G</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">GitHub</span><span style="font-size: 12px; color: #86EFAC">Connected as acme-bot</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px">
        <span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #1E293B; color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">SQ</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">SonarQube</span><span style="font-size: 12px; color: #94A3B8">Not connected</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </div>

    <h2 style="margin: 10px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #94A3B8">Appearance</h2>
    <div style="background: #111A2B; border: 1px solid #1F2A3D; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 14px">
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0B1120">
        <button type="button" role="radio" aria-checked="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; color: #CBD5E1; font: 500 13px Inter, sans-serif">System</button>
        <button type="button" role="radio" aria-checked="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; color: #CBD5E1; font: 500 13px Inter, sans-serif">Light</button>
        <button type="button" role="radio" aria-checked="true" style="height: 36px; border: 0; border-radius: 9px; background: #1E293B; color: #F1F5F9; font: 600 13px Inter, sans-serif">Dark</button>
      </div>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px">
        <span style="font-size: 15px">Reduce transparency</span>
        <input type="checkbox" role="switch" style="width: 44px; height: 26px; accent-color: {{accent}}">
      </label>
    </div>
  </main>

  <nav aria-label="Main" style="display: flex; justify-content: space-around; padding: 8px 8px 26px; background: #0F172A; border-top: 1px solid #1E293B">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; font-size: 11px; font-weight: 500; color: #94A3B8">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Home
    </a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; font-size: 11px; font-weight: 500; color: #94A3B8">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>History
    </a>
    <a href="Settings.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; font-size: 11px; font-weight: 600; color: #F1F5F9">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: {{accent}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>Settings
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; font-size: 11px; font-weight: 500; color: #94A3B8">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#7C3AED","#0F766E","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2563EB' };
  }
}
</script>
</body>
</html>
