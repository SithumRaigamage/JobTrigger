<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change password</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #020617; color: #F1F5F9; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px">

  <section role="dialog" aria-modal="true" aria-labelledby="pw-title" aria-describedby="pw-desc" style="width: 100%; box-sizing: border-box; padding: 22px 20px 20px; background: #111A2B; border: 1px solid #1F2A3D; border-radius: 22px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 id="pw-title" style="margin: 0; font-size: 20px; font-weight: 700">Change password</h2>
      <p id="pw-desc" style="margin: 0; font-size: 14px; line-height: 1.5; color: #94A3B8">You’ll stay signed in here. Every other device will be signed out.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw-current" style="font-size: 13px; font-weight: 600; color: #CBD5E1">Current password</label>
        <input id="pw-current" type="password" value="hunter2" autocomplete="current-password" style="height: 48px; padding: 0 14px; background: #0B1120; border: 1px solid #1F2A3D; border-radius: 12px; color: #F1F5F9; font: 400 16px Inter, sans-serif; outline: none">
              </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw-new" style="font-size: 13px; font-weight: 600; color: #CBD5E1">New password</label>
        <input id="pw-new" type="password" value="new-long-passphrase" autocomplete="new-password" aria-describedby="pw-rule" style="height: 48px; padding: 0 14px; background: #0B1120; border: 1px solid #1F2A3D; border-radius: 12px; color: #F1F5F9; font: 400 16px Inter, sans-serif; outline: none">
        <span id="pw-rule" style="font-size: 12px; color: #94A3B8">At least 8 characters.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw-confirm" style="font-size: 13px; font-weight: 600; color: #CBD5E1">Confirm new password</label>
        <input id="pw-confirm" type="password" value="new-long-passphrase" autocomplete="new-password" style="height: 48px; padding: 0 14px; background: #0B1120; border: 1px solid #1F2A3D; border-radius: 12px; color: #F1F5F9; font: 400 16px Inter, sans-serif; outline: none">
      </div>
    </form>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 48px; border: 1px solid #1F2A3D; border-radius: 14px; background: transparent; color: #F1F5F9; font: 600 15px Inter, sans-serif">Cancel</button>
      <button type="button" style="height: 48px; border: 0; border-radius: 14px; background: #2563EB; color: #FFFFFF; font: 600 15px Inter, sans-serif">Change</button>
    </div>
  </section>
</div>
</body>
</html>
