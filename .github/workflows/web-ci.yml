name: Website CI

# The website (JobTrigger-Web): lint, types, formatting, unit tests, then the
# Playwright run. That run has two parts: the main specs against an all-tools
# build (so tools a release hides stay tested), and the release-1.0 smoke spec
# against a second build with the real release/tools.json (Jenkins only).

on:
  push:
    branches: [ develop, flutter-migration, feature/** ]
  pull_request:
    branches: [ develop, feature/** ]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JobTrigger-Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: JobTrigger-Web/.nvmrc
          cache: npm
          cache-dependency-path: JobTrigger-Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, types and formatting
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Unit tests
        run: npm test

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Builds the site twice (all-tools, and the real manifest) and runs every
      # spec; the release-1.0 project is the smoke run against the real one.
      - name: End-to-end (all-tools build and release 1.0 smoke)
        run: npm run e2e
