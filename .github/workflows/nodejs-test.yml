name: Node.js CI - Tests

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ develop, feature/** ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # mongodb-memory-server v11 requires Node >=20.19.0.
        node-version: [20.x]
    # `secrets.*` can't be referenced directly in a step's `if:` condition --
    # route each through `env:` first, which `if:` can read.
    env:
      CODECOV_TOKEN_SET: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud's analysis needs full history for accurate blame/new-code detection.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd JobTrigger-Backend
          npm ci

      - name: Run tests with coverage
        env:
          CI: true
        run: |
          cd JobTrigger-Backend
          npm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN_SET != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: JobTrigger-Backend/coverage/lcov.info
          flags: backend

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN_SET != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
