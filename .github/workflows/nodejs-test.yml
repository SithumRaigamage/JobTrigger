name: Node.js CI - Tests

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ develop, feature/** ]

jobs:
  test:
    # Use Ubuntu 20.04 because mongodb-memory-server requires libssl1.1
    # which is available on 20.04 runners. This avoids libcrypto.so.1.1 errors.
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd lab-trigger-backend
          npm ci

      - name: Run tests
        env:
          CI: true
        run: |
          cd lab-trigger-backend
          npm test
