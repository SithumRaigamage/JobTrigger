name: Node.js CI - Tests

on:
  push:
    # flutter-migration is where the rewrite lands day-to-day (AUD-16);
    # without it here, nothing on that branch was ever analyzed or tested.
    branches: [ develop, flutter-migration, feature/** ]
  pull_request:
    branches: [ develop, feature/** ]

# AUD-59: the token gets read access only; no job here writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The Dockerfile's LTS line (AUD-17). mongodb-memory-server v11 needs
        # Node >=20.19.0, and mocha 12 needs ^20.19.0 or >=22.12.0.
        node-version: [22.x]
    # `secrets.*` can't be referenced directly in a step's `if:` condition --
    # route each through `env:` first, which `if:` can read.
    env:
      CODECOV_TOKEN_SET: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud's analysis needs full history for accurate blame/new-code detection.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd JobTrigger-Backend
          npm ci

      # AUD-07: fail on any high or critical advisory, dev dependencies
      # included (a compromised test tool runs in CI with its secrets).
      - name: Audit dependencies
        run: |
          cd JobTrigger-Backend
          npm audit --audit-level=high

      - name: Run tests with coverage
        env:
          CI: true
        run: |
          cd JobTrigger-Backend
          npm run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN_SET != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: JobTrigger-Backend/coverage/lcov.info
          flags: backend

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN_SET != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
