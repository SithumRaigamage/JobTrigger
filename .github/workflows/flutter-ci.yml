name: Flutter CI - Analyze & Test

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ develop, feature/** ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    # `secrets.*` can't be referenced directly in a step's `if:` condition --
    # route it through `env:` first, which `if:` can read.
    env:
      CODECOV_TOKEN_SET: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd JobTrigger-Frontend
          flutter pub get

      - name: Verify formatting
        run: |
          cd JobTrigger-Frontend
          dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: |
          cd JobTrigger-Frontend
          flutter analyze

      - name: Run tests
        run: |
          cd JobTrigger-Frontend
          flutter test --coverage

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN_SET != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: JobTrigger-Frontend/coverage/lcov.info
          flags: frontend
