name: CD - Build Verification

# Manual trigger only -- this workflow exists so build-verification is
# available from the Actions tab, but it never runs on its own (no push/
# pull_request trigger). No signing, no store upload, no image push: see
# docs/deployment.md for why (pre-artwork, pre-store-accounts, no registry
# configured yet).
on:
  workflow_dispatch:

# AUD-59: the token gets read access only; no job here writes to the repo.
permissions:
  contents: read

jobs:
  flutter-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd JobTrigger-Frontend
          flutter pub get

      # AUD-43: release builds refuse to start without their config, so
      # every build here passes the prod config explicitly.
      - name: Build Android APK (release, debug-signed)
        run: |
          cd JobTrigger-Frontend
          flutter build apk --release --dart-define-from-file=config/prod.json

      - name: Build iOS (release, unsigned)
        run: |
          cd JobTrigger-Frontend
          flutter build ipa --release --no-codesign --dart-define-from-file=config/prod.json

      - name: Upload Android build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-apk
          path: JobTrigger-Frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-build
          path: JobTrigger-Frontend/build/ios/archive/Runner.xcarchive
          retention-days: 7

  backend-docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build backend Docker image (no push)
        run: |
          cd JobTrigger-Backend
          docker build -t jobtrigger-backend:ci .
