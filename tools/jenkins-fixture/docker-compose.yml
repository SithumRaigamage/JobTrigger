# Fixture Jenkins (P11-01). Start it with `./fixture.sh up`, not directly:
# the script generates the passwords this file requires.
name: jobtrigger-jenkins-fixture

services:
  jenkins:
    build: .
    image: jobtrigger/jenkins-fixture:2.568.3
    container_name: jobtrigger-jenkins-fixture
    ports:
      # Bound to localhost only: this server is for local tests, never the LAN.
      - "127.0.0.1:8090:8080"
    environment:
      FIXTURE_ADMIN_PASSWORD: ${FIXTURE_ADMIN_PASSWORD:?run ./fixture.sh up}
      FIXTURE_VIEWER_PASSWORD: ${FIXTURE_VIEWER_PASSWORD:?run ./fixture.sh up}
    volumes:
      - jenkins_fixture_home:/var/jenkins_home

volumes:
  jenkins_fixture_home:
