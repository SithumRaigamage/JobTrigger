# SonarCloud project config -- this repo's own code-quality scan (separate
# from the in-app "SonarQube" CI-tool epic, which is about a user connecting
# their own SonarQube server; see docs/user-stories).
#
# sonar.projectKey/sonar.organization are placeholders -- fill these in with
# the real values once a SonarCloud project exists for this repo (Settings
# page after creating the project at sonarcloud.io), then set the
# SONAR_TOKEN GitHub repo secret. The scan step self-skips until the secret
# exists.
sonar.projectKey=CHANGE_ME
sonar.organization=CHANGE_ME

# SonarCloud has no native Dart analyzer -- JobTrigger-Frontend is included
# for basic metrics (size, duplication) but won't get Dart-specific rules
# applied. JobTrigger-Backend (JavaScript) is the primary target.
sonar.sources=JobTrigger-Backend,JobTrigger-Frontend
# The test folders sit inside the source folders, and SonarQube refuses to
# index one file as both main and test code. sonar.exclusions applies to main
# sources only, so `**/test/**` keeps tests out of "sources" while
# sonar.tests (below) still picks them up as tests.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.g.dart,**/*.freezed.dart,JobTrigger-Frontend/build/**,JobTrigger-Frontend/.dart_tool/**,**/test/**

sonar.javascript.lcov.reportPaths=JobTrigger-Backend/coverage/lcov.info
sonar.tests=JobTrigger-Backend/test,JobTrigger-Frontend/test
