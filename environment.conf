# JobTrigger development defaults. These values are safe to commit.
# Override them in the shell for one run, for example:
#   JOBTRIGGER_ENV=prod ./scripts/run-flutter.sh
#   DEVICE_NETWORK=tailscale ./scripts/run-flutter.sh
JOBTRIGGER_ENV=dev
DEVICE_NETWORK=lan

# Local device-run defaults. Every value can still be overridden in the
# shell for one run, e.g. MODE=profile scripts/run-on-iphone.sh.
# The iPhone launcher turns these into config/device.json.
MODE="${MODE:-profile}"
USE_IP="${USE_IP:-1}"
SANDBOX_BILLING="${SANDBOX_BILLING:-1}"
