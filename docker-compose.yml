services:
  mongo:
    image: mongo:8
    container_name: jobtrigger-mongo
    restart: unless-stopped
    ports:
      # AUD-64: bind to the loopback interface only. Publishing on all
      # interfaces exposed an unauthenticated MongoDB to every network
      # the dev machine was attached to.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
